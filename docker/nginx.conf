server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Angular Router uses the HTML5 history API for /orders etc. - any path
  # that isn't a real file falls back to index.html so the client router
  # can take over instead of nginx 404ing a deep link.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
